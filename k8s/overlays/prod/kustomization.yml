apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: legeni-prod
resources:
  - ../../base
  - namespace.yml
labels:
  - pairs:
      env: prod
    includeSelectors: false
replicas:
  - name: webapp
    count: 3
patches:
  - target:
      kind: Deployment
      name: webapp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "prod"
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "#8250df"
  - target:
      kind: Service
      name: webapp
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
